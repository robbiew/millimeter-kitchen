name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: mmk survey check examples/room.example.json
      - run: mmk validate examples/kitchen.fits.json
      - run: mmk draw examples/kitchen.fits.json --out out
      - run: mmk render examples/kitchen.fits.json --out out --no-render
      - run: mmk bom examples/kitchen.fits.json
      - run: mmk purchase examples/kitchen.fits.json --out out/pack
      - run: mmk export examples/kitchen.fits.json --out out
      - run: mmk edit examples/kitchen.fits.json '{"op":"set_material","role":"counter","key":"quartz-grey"}' --dry-run

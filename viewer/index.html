<!doctype html>
<meta charset="utf-8">
<title>Millimeter Kitchen viewer</title>
<style>
  html,body{margin:0;height:100%;background:#e9ebee;font:14px system-ui,sans-serif}
  #hud{position:fixed;left:12px;top:10px;background:#fffc;padding:6px 10px;border-radius:4px}
  #hud button{margin-right:6px}
  canvas{display:block}
</style>
<div id="hud">
  <span id="title">loading scene.glb…</span>
  <span id="cams"></span>
</div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
// Serve the repo (python -m http.server) and open viewer/index.html?scene=../out/scene.glb
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const params = new URLSearchParams(location.search);
const sceneUrl = params.get('scene') || '../out/scene.glb';
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe9ebee);
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.05, 100);
const controls = new OrbitControls(camera, renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff, 0x888888, 1.2));
const sun = new THREE.DirectionalLight(0xffffff, 1.5); sun.position.set(3, 6, 4); scene.add(sun);

new GLTFLoader().load(sceneUrl, (gltf) => {
  scene.add(gltf.scene);
  const cams = gltf.scene.children.filter(n => n.name.startsWith('camera:'));
  const hud = document.getElementById('cams');
  for (const c of cams) {
    const b = document.createElement('button');
    b.textContent = c.name.slice(7);
    b.onclick = () => { camera.position.copy(c.position); const t = c.userData.target_m; controls.target.set(t[0], t[1], t[2]); controls.update(); };
    hud.appendChild(b);
  }
  document.getElementById('title').textContent = sceneUrl + ' · ';
  if (cams.length) cams[cams.length - 1].parent && hud.lastChild.onclick();
  else { camera.position.set(3, 2, 4); controls.target.set(1.5, 0.9, 1); }
}, undefined, (e) => { document.getElementById('title').textContent = 'could not load ' + sceneUrl + ' (serve over http, not file://)'; });

addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
